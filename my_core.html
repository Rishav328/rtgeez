<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Experience</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background-color: #000;
        }
        
        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        
        #canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        
        #videoPlaceholder {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 100px;
            height: 160px;
            border: 2px solid white;
            border-radius: 10px;
            background-color: rgba(255, 255, 255, 0.1);
            z-index: 2;
            display: none;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        
        #videoImage {
            width: 100%;
            height: 100%;
            border-radius: 10px;
            object-fit: cover;
        }
        
        #modalContainer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: rgba(0,0,0,0.8);
            z-index: 10;
        }
        
        #modalBox {
            background-color: #fff0f5;
            padding: 30px;
            border-radius: 20px;
            align-items: center;
            margin: 0 30px;
            max-width: 90%;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 2px solid #ff69b4;
        }
        
        #modalText {
            font-size: 18px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 600;
            color: #333;
            line-height: 1.6;
        }
        
        #modalButton {
            padding: 10px 25px;
            background-color: #ff69b4;
            border-radius: 12px;
            border: none;
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        
        #modalButton:hover {
            background-color: #ff1493;
            transform: translateY(-2px);
        }
        
        #finalTextContainer {
            position: absolute;
            bottom: 40px;
            width: 80%;
            left: 10%;
            align-items: center;
            background: linear-gradient(135deg, rgba(255,192,203,0.9) 0%, rgba(255,105,180,0.9) 100%);
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            display: none;
            z-index: 5;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            border: 2px solid white;
            backdrop-filter: blur(5px);
        }
        
        #finalText {
            font-size: 22px;
            color: #8b0000;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
            font-family: 'Lobster', cursive;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.8);
        }
        
        #linkButton {
            font-size: 18px;
            color: #fff;
            font-weight: bold;
            background: linear-gradient(to right, #dc143c, #ff69b4);
            padding: 12px 25px;
            border-radius: 15px;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            border: 1px solid white;
        }
        
        #linkButton:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.4);
        }
        
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        
        #loaderText {
            color: white;
            font-size: 20px;
            margin-top: 20px;
            font-family: 'Lobster', cursive;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #ff69b4;
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="loader">
        <div class="spinner"></div>
        <div id="loaderText">Loading birthday magic...</div>
    </div>
    
    <div id="container">
        <canvas id="canvas"></canvas>
        
        <div id="videoPlaceholder">
            <img id="videoImage" src="./8.png" alt="Birthday">
        </div>
        
        <div id="modalContainer">
            <div id="modalBox">
                <div id="modalText">Press on cake to blow the candles</div>
                <button id="modalButton">OK</button>
            </div>
        </div>
        
        <div id="finalTextContainer">
            <div id="finalText">Thank you for everything, my closest one! ❤️<br>May your day be as special as you are!</div>
            <a href="/" id="linkButton">Go Home</a>
        </div>
    </div>
    
    <script>
        // Global variables
        let scene, camera, renderer, cakeGroup, candleFire, fireworks, heart;
        let candleBlown = false;
        let modalStep = 0;
        let finalStep = false;
        let videoVisible = true;
        let fireworkAnimId = null;
        let heartAnimId = null;
        let cakeAnimId = null;
        const sounds = {};
        let bgPlane = null;

        // DOM elements
        const modalContainer = document.getElementById('modalContainer');
        const modalText = document.getElementById('modalText');
        const modalButton = document.getElementById('modalButton');
        const videoPlaceholder = document.getElementById('videoPlaceholder');
        const finalTextContainer = document.getElementById('finalTextContainer');
        const loader = document.getElementById('loader');

        // Audio files
        const audioFiles = {
            blow: 'audiop.mp3',
            message: 'v3.mp3',
            birthday: 'bday.mp3'
        };

        // Image files
        const imageFiles = {
            initialBg: '3.png',
            finalBg: '5_5.png',
            placeholder: '8.png'
        };

        // Load assets
        function loadAssets(callback) {
            let loaded = 0;
            const total = Object.keys(audioFiles).length + Object.keys(imageFiles).length;
            
            function assetLoaded() {
                loaded++;
                document.getElementById('loaderText').textContent = `Loading birthday magic... ${Math.round((loaded/total)*100)}%`;
                
                if (loaded >= total) {
                    setTimeout(() => {
                        loader.style.display = 'none';
                        callback();
                    }, 500);
                }
            }
            
            // Load images
            Object.keys(imageFiles).forEach(key => {
                const img = new Image();
                img.onload = assetLoaded;
                img.src = imageFiles[key];
                
                // Set placeholder image
                if (key === 'placeholder') {
                    document.getElementById('videoImage').src = img.src;
                }
            });
            
            // Load audio files
            Object.keys(audioFiles).forEach(key => {
                sounds[key] = new Audio(audioFiles[key]);
                sounds[key].addEventListener('canplaythrough', assetLoaded);
                sounds[key].load();
            });
        }

        // Initialize Three.js scene
        function initThreeJS() {
            const canvas = document.getElementById('canvas');
            
            // Scene setup
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 3, 5);
            camera.lookAt(0, 0, 0);
            
            renderer = new THREE.WebGLRenderer({ 
                canvas, 
                antialias: true,
                alpha: true 
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            
            // Set initial background
            setBackground('initialBg');
            
            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
            directionalLight.position.set(5, 5, 5);
            scene.add(directionalLight);
            
            // Create cake
            createCake();
            
            // Start animation
            animate();
            
            // Handle window resize
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
            
            // Handle clicks on canvas (for blowing candle)
            canvas.addEventListener('click', handleCakePress);
        }

        // Set background image
        function setBackground(imageKey) {
            // Remove existing background plane if it exists
            if (bgPlane) {
                scene.remove(bgPlane);
                bgPlane.material.map.dispose();
                bgPlane.geometry.dispose();
            }
            
            // Create texture from image
            const img = new Image();
            img.src = imageFiles[imageKey];
            
            const texture = new THREE.Texture(img);
            img.onload = () => {
                texture.needsUpdate = true;
            };
            
            // Create background plane
            const aspect = img.width / img.height;
            const bgGeometry = new THREE.PlaneGeometry(aspect * 10, 10);
            const bgMaterial = new THREE.MeshBasicMaterial({
                map: texture,
                side: THREE.DoubleSide
            });
            bgPlane = new THREE.Mesh(bgGeometry, bgMaterial);
            bgPlane.position.z = -10;
            scene.add(bgPlane);
        }

        // Create 3D cake with adjusted position
        function createCake() {
            cakeGroup = new THREE.Group();
            
            // Cake base
            const baseGeometry = new THREE.CylinderGeometry(1.5, 1.5, 1, 32);
            const baseMaterial = new THREE.MeshPhongMaterial({ color: 0xffc0cb });
            const cakeBase = new THREE.Mesh(baseGeometry, baseMaterial);
            cakeGroup.add(cakeBase);
            
            // Top layer
            const topLayerGeometry = new THREE.CylinderGeometry(1.2, 1.2, 0.5, 32);
            const topLayerMaterial = new THREE.MeshPhongMaterial({ color: 0xff69b4 });
            const cakeTop = new THREE.Mesh(topLayerGeometry, topLayerMaterial);
            cakeTop.position.y = 0.75;
            cakeGroup.add(cakeTop);
            
            // Candle
            const candleGeometry = new THREE.CylinderGeometry(0.1, 0.1, 0.6, 16);
            const candleMaterial = new THREE.MeshPhongMaterial({ color: 0xffff00 });
            const candle = new THREE.Mesh(candleGeometry, candleMaterial);
            candle.position.y = 1.2;
            cakeGroup.add(candle);
            
            // Flame
            const flameGeometry = new THREE.SphereGeometry(0.1, 16, 16);
            const flameMaterial = new THREE.MeshBasicMaterial({ color: 0xffa500 });
            const flame = new THREE.Mesh(flameGeometry, flameMaterial);
            flame.position.y = 1.5;
            cakeGroup.add(flame);
            
            // Adjusted cake position to be lower (changed y from -0.5 to -1.5)
            cakeGroup.position.y = -1.5;
            candleFire = flame;
            
            scene.add(cakeGroup);
        }

        // Handle cake press (blow candle)
        function handleCakePress() {
            if (candleFire && !candleBlown) {
                cakeGroup.remove(candleFire);
                candleBlown = true;
                
                // Play blow sound
                sounds.blow.play();
                
                sounds.blow.addEventListener('ended', () => {
                    launchFireworks();
                    
                    // Play message and birthday song
                    sounds.message.play();
                    sounds.birthday.play();
                    
                    sounds.message.addEventListener('ended', () => {
                        stopFireworks();
                        setModalStep(1);
                        modalContainer.style.display = 'flex';
                        cakeGroup.visible = false;
                        videoPlaceholder.style.display = 'none';
                        // Change to final background
                        setBackground('finalBg');
                    });
                });
            }
        }

        // Launch fireworks animation
        function launchFireworks() {
            const particlesGeometry = new THREE.BufferGeometry();
            const particleCount = 200;
            const positions = new Float32Array(particleCount * 3);
            
            for (let i = 0; i < particleCount; i++) {
                positions[i * 3] = (Math.random() - 0.5) * 4;
                positions[i * 3 + 1] = (Math.random() - 0.5) * 4 + 2;
                positions[i * 3 + 2] = (Math.random() - 0.5) * 4;
            }
            
            particlesGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            
            const material = new THREE.PointsMaterial({
                color: 0xffd700,
                size: 0.2,
                transparent: true,
                opacity: 1.0,
            });
            
            fireworks = new THREE.Points(particlesGeometry, material);
            scene.add(fireworks);
            
            function animateParticles() {
                if (!fireworks) return;
                fireworks.rotation.y += 0.01;
                fireworkAnimId = requestAnimationFrame(animateParticles);
            }
            
            animateParticles();
        }

        // Stop fireworks
        function stopFireworks() {
            if (fireworks) {
                scene.remove(fireworks);
                fireworks = null;
            }
            cancelAnimationFrame(fireworkAnimId);
        }

        // Display hearts
        function displayHearts() {
            const heartShape = new THREE.Shape();
            heartShape.moveTo(0, 0);
            heartShape.bezierCurveTo(0, 0, 0, 1.2, -0.75, 1.2);
            heartShape.bezierCurveTo(-1.5, 1.2, -1.5, 0.3, -1.5, 0.3);
            heartShape.bezierCurveTo(-1.5, -0.3, -0.75, -0.9, 0, -1.5);
            heartShape.bezierCurveTo(0.75, -0.9, 1.5, -0.3, 1.5, 0.3);
            heartShape.bezierCurveTo(1.5, 0.3, 1.5, 1.2, 0.75, 1.2);
            heartShape.bezierCurveTo(0, 1.2, 0, 0, 0, 0);

            const extrudeSettings = {
                depth: 0.2,
                bevelEnabled: true,
                bevelSegments: 2,
                steps: 2,
                bevelSize: 0.1,
                bevelThickness: 0.1,
            };
            
            const geometry = new THREE.ExtrudeGeometry(heartShape, extrudeSettings);
            const material = new THREE.MeshPhongMaterial({ color: 0xff69b4 });
            heart = new THREE.Mesh(geometry, material);
            heart.scale.set(0.2, 0.2, 0.2);
            heart.position.set(-1.5, 2, 0);
            scene.add(heart);
            
            function animateHearts() {
                heart.rotation.y += 0.02;
                heartAnimId = requestAnimationFrame(animateHearts);
            }
            
            animateHearts();
        }

        // Stop all sounds
        function stopAllSounds() {
            Object.values(sounds).forEach(sound => {
                sound.pause();
                sound.currentTime = 0;
            });
        }

        // Set modal step
        function setModalStep(step) {
            modalStep = step;
            
            switch(step) {
                case 0:
                    modalText.textContent = 'Press on cake to blow the candles';
                    break;
                case 1:
                    modalText.textContent = 'Happy Birthday Liza!!';
                    break;
                case 2:
                    modalText.textContent = 'Hope you love this! Happy Birthday to the one who fills my life with affection, laughter, and light. On this special day, I just want to remind you how much you mean to me. Your presence makes everything brighter, your smile lifts my spirits, and your support is the greatest gift of all. May this year bring you endless joy, beautiful memories, and all the happiness your heart can hold. Here\'s to celebrating you today and always. ❤️🎂Enjoy your day! ';
                    break;
                case 3:
                    modalText.textContent = "Sorry again!! I'll always be with you, from your side, Thank you for all! Enjoy today! Bas jldi se jldi Amsterdam ke kareeb aa rahe hai hum!! Haha";
                    break;
            }
        }

        // Handle modal next button
        function handleModalNext() {
            if (modalStep === 0) {
                modalContainer.style.display = 'none';
                videoPlaceholder.style.display = 'block';
            } else if (modalStep < 3) {
                setModalStep(modalStep + 1);
            } else {
                modalContainer.style.display = 'none';
                finalStep = true;
                finalTextContainer.style.display = 'flex';
                displayHearts();
            }
        }

        // Main animation loop
        function animate() {
            requestAnimationFrame(animate);
            
            if (cakeGroup && cakeGroup.visible !== false) {
                cakeGroup.rotation.y += 0.01;
            }
            
            renderer.render(scene, camera);
        }

        // Initialize the app when assets are loaded
        modalButton.addEventListener('click', handleModalNext);
        document.getElementById('linkButton').addEventListener('click', stopAllSounds);
        
        // Start loading assets and initialize
        loadAssets(() => {
            initThreeJS();
            videoPlaceholder.style.display = 'block';
        });
    </script>
</body>
</html>
