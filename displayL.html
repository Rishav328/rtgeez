<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Liza's Birthday Celebration</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" />

  <!-- SweetAlert2 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>body {
    font-family: 'Lobster', cursive;
    margin: 0;
    background-color: #f0f0f0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
  }
  
  .loader-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(255, 255, 255, 0.9);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 1000;
    flex-direction: column;
  }
  
  .loader {
    border: 8px solid #f3f3f3;
    border-top: 8px solid #D81B60;
    border-radius: 50%;
    width: 50px;
    height: 50px;
    animation: spin 2s linear infinite;
    margin-bottom: 20px;
  }
  
  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  
  .loaded-content {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    padding-bottom: 30px;
    position: fixed;
    bottom: 0;
    width: 100%;
    z-index: 10;
  }
  
  .background-image {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: -1;
  }
  
  .card-container {
    background-color: rgba(255, 255, 255, 0.7);
    border-radius: 15px;
    padding: 15px;
    width: 80%;
    max-width: 400px;
    text-align: center;
    margin-bottom: 10px;
  }
  
  .buttons-container {
    display: flex;
    justify-content: space-between;
    width: 80%;
    max-width: 400px;
    margin-bottom: 20px;
  }
  
  .button {
    background-color: rgba(0, 0, 0, 0.7);
    color: white;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    border: none;
    font-family: 'Lobster', cursive;
  }
  
  .button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  
  .heading-container {
    background-color: #D81B60;
    padding: 8px 15px;
    border-radius: 6px;
    margin-bottom: 8px;
    display: inline-block;
  }
  
  .caption {
    font-weight: bold;
    text-align: center;
    color: white;
    font-size: 22px;
    margin: 0;
  }
  
  .description-container {
    background-color: #F48FB1;
    border-radius: 6px;
    padding: 10px;
  }
  
  .description {
    text-align: center;
    line-height: 18px;
    color: white;
    font-size: 16px;
    margin: 0;
    text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
  }
  
  #startScreen {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #fff;
    z-index: 2000;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
  }
  
  #startBtn {
    font-family: 'Lobster', cursive;
    font-size: 24px;
    background-color: #D81B60;
    color: white;
    padding: 15px 30px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
  }
  
  </style>
</head>
<body>
  <div id="startScreen">
    <button id="startBtn">Start</button>
  </div>

  <div class="loader-container" id="loaderContainer">
    <div class="loader"></div>
    <p>Loading memories...</p>
  </div>

  <div class="loaded-content" id="content">
    <img id="backgroundImage" class="background-image" src="" alt="Background Image" />
    <div class="card-container">
      <div class="heading-container">
        <h2 class="caption" id="captionText"></h2>
      </div>
      <div class="description-container">
        <p class="description" id="descriptionText"></p>
      </div>
    </div>
    <div class="buttons-container">
      <button class="button" id="prevButton" disabled>Previous</button>
      <button class="button" id="nextButton">Next</button>
    </div>
  </div>

  <audio id="openingMusic" loop></audio>

  <script>
    const imageData = [
      { id: 1, source: './1.png', caption: "Your Birthday Glow", description: "Happy birthday, Liza! From 11th grade to college, you’re my closest friend. I’m here to make today as special as you are." },
      { id: 2, source: './2.png', caption: "My Deep Regret", description: "I’m sorry for saying you were using me, Liza. It was fear, not truth. Let’s make your birthday about joy, not my mistake." },
      { id: 3, source: './3.png', caption: "Our Unbreakable Bond", description: "Happy birthday, Liza! You’re the friend I trust with all my secrets. I care about you so much and want you to shine today." },
      { id: 4, source: './4.png', caption: "Cherishing You", description: "From school to college, Liza, our friendship’s my favorite story. On your birthday, I’m all about making you smile." },
      { id: 5, source: './5.png', caption: "Owning My Fault", description: "I’m sorry for calling you a timepass, Liza. I was scared and wrong. Your birthday’s for celebrating you, not my errors." },
      { id: 6, source: './6.png', caption: "Learning from Me", description: "Sorry I let fear hurt you, Liza. On your birthday, I’m focused on being the friend you deserve, starting now." },
      { id: 7, source: './7.png', caption: "Your Day to Shine", description: "It’s your birthday, Liza! I care about you tons and want today to feel like a warm hug from your best friend." },
      { id: 8, source: './me.png', caption: "Here for You", description: "Happy birthday, Liza! My care for you is bigger than any fight. I’m here to lift you up today and always." },
      { id: 9, source: './8.png', caption: "My Biggest Promise", description: "**I’ll always protect you, Liza. I’ll always support you, I’ll be with you even if world’s against.** Happy birthday—my loyalty’s forever." },
      { id: 10, source: './5_5.png', caption: "Liza’s Birthday Party", description: "Happy birthday, Liza! You’re my best friend, and I mean it—I’m here to make every moment of today amazing for you." }
    ];

    let currentImageIndex = 0;
    const backgroundImage = document.getElementById('backgroundImage');
    const captionText = document.getElementById('captionText');
    const descriptionText = document.getElementById('descriptionText');
    const prevButton = document.getElementById('prevButton');
    const nextButton = document.getElementById('nextButton');
    const content = document.getElementById('content');
    const loaderContainer = document.getElementById('loaderContainer');
    const openingMusic = document.getElementById('openingMusic');
    const startBtn = document.getElementById('startBtn');
    const startScreen = document.getElementById('startScreen');
    openingMusic.src = './opening.mp3';

    function updateImage() {
      const currentData = imageData[currentImageIndex];
      backgroundImage.src = currentData.source;
      captionText.textContent = currentData.caption;
      descriptionText.innerHTML = currentData.description;
      prevButton.disabled = currentImageIndex === 0;
      nextButton.textContent = currentImageIndex === imageData.length - 1 ? 'Celebrate!' : 'Next';
    }

    function goToPrevious() {
      if (currentImageIndex > 0) {
        currentImageIndex--;
        updateImage();
      }
    }

    function goToNext() {
      if (currentImageIndex < imageData.length - 1) {
        currentImageIndex++;
        updateImage();
      } else {
        window.location.href = 'my_core.html';
      }
    }

    let assetsLoaded = 0;
    const totalAssets = imageData.length + 1;

    function assetLoaded() {
      assetsLoaded++;
      if (assetsLoaded === totalAssets) {
        setTimeout(() => {
          loaderContainer.style.display = 'none';
          content.style.display = 'flex';
          openingMusic.play().catch(error => console.error("Error playing audio:", error));
          updateImage();
        }, 1000);
      }
    }

    startBtn.addEventListener('click', () => {
      Swal.fire({
        title: 'Welcome Liza 🎉',
        text: 'Are you ready to begin?',
        icon: 'info',
        confirmButtonText: 'Okay',
        confirmButtonColor: '#D81B60'
      }).then(() => {
        startScreen.style.display = 'none';
        loaderContainer.style.display = 'flex';

        imageData.forEach(item => {
          const img = new Image();
          img.onload = assetLoaded;
          img.onerror = () => console.error("Error loading image:", item.source);
          img.src = item.source;
        });

        openingMusic.addEventListener('loadeddata', assetLoaded);
        openingMusic.addEventListener('error', () => console.error("Error loading audio:", openingMusic.src));
      });
    });

    prevButton.addEventListener('click', goToPrevious);
    nextButton.addEventListener('click', goToNext);
  </script>
</body>
</html>
